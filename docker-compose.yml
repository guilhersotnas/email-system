services:

  zoo:
    image: zookeeper:3.9
    container_name: zoo
    ports:
      - "2181:2181"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - rabbitmq
      - zoo

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - rabbitmq
      - mailhog
      - zoo

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
